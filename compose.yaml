services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    healthcheck:
      test: ["CMD", "python", "-c", "import os; p=os.getenv('DB_PATH','data/directory.sqlite3'); print(p)"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["python", "run_web.py"]
    ports:
      - "127.0.0.1:8080:8080"

  backup:
    build: .
    profiles: ["tools"]
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["python", "scripts/backup.py", "--out-dir", "backups", "--keep", "30"]
