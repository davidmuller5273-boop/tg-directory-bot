{% extends "base.html" %}{% block title %}审计日志{% endblock %}
{% block content %}
<header class="page-head"><div><h1>审计日志</h1><p>最近 200 条关键管理操作</p></div></header>
<div class="table-wrap"><table><thead><tr><th>时间</th><th>操作者</th><th>动作</th><th>目标</th><th>详情</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.created_at|beijing_time }}</td><td>{{ r.actor }}</td><td><code>{{ r.action }}</code></td><td>{{ r.target }}</td><td>{{ r.detail }}</td></tr>{% else %}<tr><td colspan="5" class="empty">暂无日志</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
