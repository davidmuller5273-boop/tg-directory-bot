<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录后台</title><link rel="stylesheet" href="/static/admin.css">
</head>
<body class="login-body">
  <main class="login-panel">
    <div class="brand login-brand"><span class="brand-mark">TG</span><span>{{ site.site_name }}</span></div>
    <h1>管理员登录</h1>
    {% if error %}<div class="flash error">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="stack">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <label>用户名<input name="username" required autocomplete="username"></label>
      <label>密码<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="button primary" type="submit">登录</button>
    </form>
  </main>
</body>
</html>
