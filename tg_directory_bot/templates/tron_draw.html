<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>开奖走势</title>
<style>
:root{--single:#12b886;--double:#f03e3e;--bg:#f4f6f8;--card:#fff;--text:#1f2933;--muted:#7b8794;--line:#e4e7eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:18px;margin:0}
.counts{font-size:16px;font-weight:600}
.counts .s{color:var(--single)}.counts .d{color:var(--double)}
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:12px 0 10px}
.tab{padding:6px 2px;color:var(--muted);cursor:pointer;border:0;background:none;font-size:15px;border-bottom:2px solid transparent}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--single)}
.periods{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.periods button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;font-size:14px;cursor:pointer}
.periods button.on{background:var(--single);border-color:var(--single);color:#fff}
.periods input{width:84px;padding:4px 8px;border:1px solid var(--line);border-radius:16px;font-size:14px}
.road{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.grid{display:grid;grid-auto-flow:column;gap:4px;width:max-content}
.cell{width:26px;height:26px}
.bead{width:26px;height:26px;border-radius:50%;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.bead.s{background:var(--single)}.bead.d{background:var(--double)}
.muted{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.hash{font-family:ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.hash b{color:var(--text);text-decoration:underline}
.res.s{color:var(--single);font-weight:600}.res.d{color:var(--double);font-weight:600}
.ref .big{font-size:34px;font-weight:700;line-height:1.2}
.ref .big.s{color:var(--single)}.ref .big.d{color:var(--double)}
.algos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.algos button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font-size:14px;cursor:pointer}
.algos button.on{background:#364fc7;border-color:#364fc7;color:#fff}
.set{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin:6px 0}
.set input,.set select{padding:3px 6px;border:1px solid var(--line);border-radius:8px;font-size:13px;width:64px}
.set select{width:auto}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;font-size:13px;margin-top:8px}
.stats div span{color:var(--muted)}
.note{background:#fff9db;color:#8a6d00;border-radius:8px;padding:6px 10px;font-size:12px;margin-top:8px}
.rule{font-size:12px;color:var(--muted);line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
 <div class="card">
  <div class="head"><h1>开奖走势</h1><div class="counts"><span class="s">单 <span id="cs">-</span></span> / <span class="d">双 <span id="cd">-</span></span></div></div>
  <div class="tabs"><button class="tab on" data-tab="block">区块走势</button><button class="tab" data-tab="mine">我的走势</button></div>
  <div id="pane-block">
   <div class="periods" id="periods">
    <button data-n="50">50</button><button data-n="100" class="on">100</button><button data-n="500">500</button>
    <input id="custom" type="number" min="1" max="5000" inputmode="numeric" placeholder="自定义"><button id="go">确定</button>
   </div>
   <div class="road" id="road"><div class="grid" id="grid"></div></div>
   <div class="muted" id="meta"></div>
  </div>
  <div id="pane-mine" hidden><p class="muted">暂无个人数据。</p></div>
 </div>
 <div class="card ref">
  <div class="head"><strong>参考</strong><span class="muted" id="refnext">下一期参考方向</span></div>
  <div class="algos" id="algos">
   <button data-a="trend">顺势</button><button data-a="dragon">跟龙/斩龙</button><button data-a="ratio">近期占比</button><button data-a="minority">近期少数方</button>
  </div>
  <div class="set">
   <label>龙长≥N <input id="setn" type="number" min="2" max="50" inputmode="numeric"></label>
   <label>模式 <select id="setmode"><option value="follow">跟龙</option><option value="cut">斩龙</option></select></label>
   <label>近M期 <input id="setm" type="number" min="1" max="200" inputmode="numeric"></label>
   <label>少数方M <input id="setmn" type="number" min="1" max="200" inputmode="numeric"></label>
  </div>
  <div class="big" id="refbig">-</div>
  <div class="muted" id="refrate"></div>
  <table><thead><tr><th>算法</th><th>参考</th><th>回测命中（所选期数）</th></tr></thead><tbody id="reftable"></tbody></table>
  <div class="stats" id="refstats"></div>
  <div class="note">开奖为哈希末位，单双各约50%，各算法命中率理论上也约50%，统计仅供参考。</div>
 </div>
 <div class="card">
  <strong>最近开奖</strong>
  <table><thead><tr><th>区块</th><th>哈希（末位数字加粗）</th><th>结果</th></tr></thead><tbody id="recent"></tbody></table>
 </div>
 <div class="rule">规则：每 20 个区块开奖一次，区块高度以 00/20/40/60/80 结尾的区块为开奖块；取该区块哈希，忽略字母，取最后一位数字：1/3/5/7/9 为单，0/2/4/6/8 为双。数据每 4 秒自动刷新，时间为区块时间（北京时间）。</div>
</div>
<script>
(function(){
var limit=parseInt(localStorage.getItem("trondraw.limit")||"100",10)||100;
var busy=false;
var ALG={trend:"顺势",dragon:"跟龙/斩龙",ratio:"近期占比",minority:"近期少数方"};
var cfg={n:clamp(localStorage.getItem("trondraw.n"),3,2,50),m:clamp(localStorage.getItem("trondraw.m"),20,1,200),
 mn:clamp(localStorage.getItem("trondraw.mn"),10,1,200),
 mode:localStorage.getItem("trondraw.mode")==="cut"?"cut":"follow",algo:localStorage.getItem("trondraw.algo")||"trend"};
if(!ALG[cfg.algo])cfg.algo="trend";
function clamp(v,d,lo,hi){v=parseInt(v,10);if(isNaN(v))v=d;return Math.max(lo,Math.min(hi,v))}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hashHtml(h,d){var i=h.lastIndexOf(String(d));return esc(h.slice(0,i))+"<b>"+esc(h.charAt(i))+"</b>"+esc(h.slice(i+1))}
function mark(){
  var btns=document.querySelectorAll("#periods button[data-n]");
  for(var i=0;i<btns.length;i++){btns[i].className=(parseInt(btns[i].getAttribute("data-n"),10)===limit)?"on":""}
}
function cls(v){return v==="单"?"s":"d"}
function renderRef(r){
  var name=cfg.algo==="dragon"?(cfg.mode==="cut"?"斩龙":"跟龙"):ALG[cfg.algo];
  var a=r.algorithms[cfg.algo];
  var big=$("refbig");
  big.textContent=a.next||"-";big.className="big "+(a.next?cls(a.next):"");
  $("refnext").textContent="下一期参考方向 · "+name;
  $("refrate").textContent=a.total?("回测命中 "+a.hits+"/"+a.total+"（"+a.rate+"%）"):"数据不足，暂无回测";
  $("reftable").innerHTML=Object.keys(ALG).map(function(k){
    var x=r.algorithms[k];
    return "<tr><td>"+(k==="dragon"?(cfg.mode==="cut"?"斩龙(N="+cfg.n+")":"跟龙(N="+cfg.n+")"):k==="ratio"?"近期占比(M="+cfg.m+")":k==="minority"?"近期少数方(M="+cfg.mn+")":ALG[k])+"</td><td class='res "+(x.next?cls(x.next):"")+"'>"+(x.next||"-")+"</td><td>"+(x.total?x.hits+"/"+x.total+"（"+x.rate+"%）":"-")+"</td></tr>"
  }).join("");
  var sv=r.current_value?(r.current_streak+" 连"+r.current_value):"-";
  $("refstats").innerHTML="<div><span>当前连续：</span>"+sv+"</div><div><span>最长连续：</span>"+r.longest_streak+"</div>"+
   "<div><span>单占比：</span>"+(r.ratio.single===null?"-":r.ratio.single+"%")+"</div><div><span>双占比：</span>"+(r.ratio.double===null?"-":r.ratio.double+"%")+"</div>"+
   "<div><span>单遗漏：</span>"+r.omission.single+" 期</div><div><span>双遗漏：</span>"+r.omission.double+" 期</div>";
}
function markAlgo(){
  var b=document.querySelectorAll("#algos button");
  for(var i=0;i<b.length;i++)b[i].className=b[i].getAttribute("data-a")===cfg.algo?"on":"";
}
function render(d){
  renderRef(d.reference);
  $("cs").textContent=d.counts.single;$("cd").textContent=d.counts.double;
  var g=$("grid");g.innerHTML="";
  g.style.gridTemplateRows="repeat("+d.max_rows+",26px)";
  g.style.gridTemplateColumns="repeat("+Math.max(d.columns,1)+",26px)";
  d.cells.forEach(function(c){
    var e=document.createElement("div");e.className="bead "+(c.v==="单"?"s":"d");e.textContent=c.v;
    e.style.gridColumn=c.c+1;e.style.gridRow=c.r+1;g.appendChild(e);
  });
  var road=$("road");road.scrollLeft=road.scrollWidth;
  $("meta").textContent="近 "+d.count+" 期（已记录 "+d.total_recorded+" 期）"+(d.latest?" · 最新开奖块 #"+d.latest:"")+(d.next_draw_block?" · 下一开奖块 #"+d.next_draw_block:"");
  $("recent").innerHTML=d.recent.map(function(r){
    return "<tr><td>#"+r.block+"<div class=muted>"+esc(r.time)+"</div></td><td class=hash>"+hashHtml(r.hash,r.digit)+"</td><td class='res "+(r.result==="单"?"s":"d")+"'>"+r.result+"</td></tr>"
  }).join("")||"<tr><td colspan=3 class=muted>暂无数据，等待下一个开奖块。</td></tr>";
}
function load(){
  if(busy)return;busy=true;
  fetch("/api/tron-draw?limit="+limit+"&streak_n="+cfg.n+"&recent_m="+cfg.m+"&mode="+cfg.mode+"&minority_m="+cfg.mn,{cache:"no-store"}).then(function(r){return r.json()}).then(render).catch(function(){}).then(function(){busy=false});
}
function setLimit(n){limit=Math.max(1,Math.min(5000,n||100));localStorage.setItem("trondraw.limit",limit);mark();load()}
document.querySelectorAll("#periods button[data-n]").forEach(function(b){b.onclick=function(){setLimit(parseInt(b.getAttribute("data-n"),10))}});
$("go").onclick=function(){var v=parseInt($("custom").value,10);if(v>0)setLimit(v)};
$("custom").onkeydown=function(e){if(e.key==="Enter")$("go").onclick()};
document.querySelectorAll(".tab").forEach(function(t){t.onclick=function(){
  document.querySelectorAll(".tab").forEach(function(x){x.className="tab"});t.className="tab on";
  $("pane-block").hidden=t.getAttribute("data-tab")!=="block";$("pane-mine").hidden=t.getAttribute("data-tab")!=="mine";
}});
function saveCfg(){
  cfg.n=clamp($("setn").value,3,2,50);cfg.m=clamp($("setm").value,20,1,200);cfg.mn=clamp($("setmn").value,10,1,200);cfg.mode=$("setmode").value==="cut"?"cut":"follow";
  localStorage.setItem("trondraw.n",cfg.n);localStorage.setItem("trondraw.m",cfg.m);localStorage.setItem("trondraw.mn",cfg.mn);localStorage.setItem("trondraw.mode",cfg.mode);localStorage.setItem("trondraw.algo",cfg.algo);
  load();
}
$("setn").value=cfg.n;$("setm").value=cfg.m;$("setmn").value=cfg.mn;$("setmode").value=cfg.mode;
$("setn").onchange=$("setm").onchange=$("setmn").onchange=$("setmode").onchange=saveCfg;
document.querySelectorAll("#algos button").forEach(function(b){b.onclick=function(){cfg.algo=b.getAttribute("data-a");markAlgo();saveCfg()}});
markAlgo();
mark();load();setInterval(function(){if(!document.hidden)load()},4000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)load()});
})();
</script>
</body>
</html>
